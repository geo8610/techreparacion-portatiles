const deaccent = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function chatLog() { return document.getElementById('chat-log'); }

function chatScroll() { const l = chatLog(); l.scrollTop = l.scrollHeight; }

function chatBubble(html, from) {
  const el = document.createElement('div');
  const bot = from !== 'user';
  el.className = 'chat-in flex ' + (bot ? 'justify-start' : 'justify-end');
  el.innerHTML = bot
    ? '<div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl rounded-tl-sm bg-white/[.07] border border-white/[.06] text-[13px] leading-relaxed text-neutral-200">' + html + '</div>'
    : '<div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl rounded-tr-sm bg-accent text-ink-950 text-[13px] leading-relaxed font-medium">' + html + '</div>';
  chatLog().appendChild(el);
  chatScroll();
}

function chatTyping() {
  const el = document.createElement('div');
  el.className = 'chat-in flex justify-start';
  el.id = 'chat-typing';
  el.innerHTML = '<div class="chat-typing flex items-center gap-1 px-4 py-3 rounded-2xl rounded-tl-sm bg-white/[.07] border border-white/[.06]">' +
    '<span class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span><span class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span><span class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span></div>';
  chatLog().appendChild(el);
  chatScroll();
}

function chatChips(options, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'chat-in flex flex-wrap gap-2';
  options.forEach((o, i) => {
    const label = typeof o === 'string' ? o : o.label;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.className = 'px-3 py-2 rounded-full text-[12px] font-medium bg-white/[.06] border border-white/10 text-neutral-200 hover:border-accent/60 hover:text-accent hover:bg-accent/10 transition-colors';
    btn.addEventListener('click', () => { wrap.remove(); onPick(i); });
    wrap.appendChild(btn);
  });
  chatLog().appendChild(wrap);
  chatScroll();
}

function chatLink(label, href, wasa) {
  const wrap = document.createElement('div');
  wrap.className = 'chat-in';
  wrap.innerHTML = '<a href="' + href + '" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 w-full px-4 py-3 rounded-xl text-sm font-semibold ' +
    (wasa ? 'bg-wasa text-ink-950 hover:bg-wasa-hover' : 'bg-accent text-ink-950 hover:brightness-110') +
    ' transition-all">' + icon('whatsapp', 'w-4 h-4') + label + '</a>';
  chatLog().appendChild(wrap);
  chatScroll();
}

function chatSay(html, delay) {
  chatTyping();
  setTimeout(() => {
    const t = document.getElementById('chat-typing');
    if (t) t.remove();
    chatBubble(html, 'bot');
  }, delay || 380);
}

const chatState = { step: 'idle', device: '', symptom: '', urgent: '', name: '' };

function chatFaq(id) {
  const b = CONFIG.brand;
  if (id === 'precios') {
    return CONFIG.services.items.map(s => s.title + ': ' + s.price).join('<br>');
  }
  if (id === 'garantia') {
    const g = CONFIG.hero.trust.find(t => t.icon === 'shield');
    return g ? g.text : CONFIG.services.note;
  }
  if (id === 'horario') {
    return b.hours.map(h => h.day + ': ' + h.time).join('<br>');
  }
  if (id === 'ubicacion') {
    return b.address + ', ' + b.addressLine2 + '<br><a href="' + b.mapsUrl + '" target="_blank" rel="noopener" class="text-accent underline">Ver en el mapa</a>';
  }
  if (id === 'placa') {
    const s = CONFIG.services.items.find(x => x.icon === 'chip');
    return s ? s.text + ' ' + s.price + '. ' + s.time + '.' : '';
  }
  if (id === 'mantenimiento') {
    return CONFIG.hero.maintenance.lead + '<br>' + CONFIG.hero.maintenance.bullets.slice(0, 3).join(' · ');
  }
  return '';
}

function chatStart() {
  const l = chatLog();
  l.innerHTML = '';
  chatState.step = 'device';
  chatState.device = chatState.symptom = chatState.urgent = chatState.name = '';
  chatBubble(BOT.greeting, 'bot');
  setTimeout(() => {
    chatSay(BOT.steps.device);
    chatChips(BOT.devices, i => chatPickDevice(BOT.devices[i]));
  }, 500);
}

function chatPickDevice(label) {
  chatBubble(label, 'user');
  chatState.device = label;
  chatState.step = 'fault';
  chatSay(BOT.steps.fault);
  chatChips(CONFIG.symptoms.items.map(s => s.title), i => chatPickSymptom(i));
}

function chatPickSymptom(i) {
  const sym = CONFIG.symptoms.items[i];
  chatBubble(sym.title, 'user');
  chatState.symptom = sym.title;
  chatState.step = 'urgency';
  const svc = serviceOf(sym.icon);
  const body = svc
    ? BOT.priceLead + ' <strong class="text-white">' + svc.price + '</strong> (' + svc.time + ').<br>' + BOT.priceTail
    : BOT.priceLead + ' el precio te lo confirmamos con el diagnóstico.';
  chatSay(body + '<br>' + BOT.photoAsk);
  setTimeout(() => {
    chatSay(BOT.steps.urgency);
    chatChips(BOT.urgency, k => chatPickUrgency(k === 0));
  }, 900);
}

function chatPickUrgency(isUrgent) {
  chatBubble(isUrgent ? BOT.urgency[0] : BOT.urgency[1], 'user');
  chatState.urgent = isUrgent ? 'urgente' : 'puede esperar';
  chatState.step = 'handoff';
  if (isUrgent) {
    chatSay(BOT.urgent);
    setTimeout(chatHandoff, 700);
  } else {
    chatState.step = 'name';
    chatSay(BOT.steps.name);
  }
}

function chatSummary() {
  const sym = CONFIG.symptoms.items.find(s => s.title === chatState.symptom);
  let msg = 'Hola, te escribo desde la página de ' + CONFIG.brand.name + '.';
  msg += '\n\nEquipo: ' + (chatState.device || 'por confirmar');
  if (chatState.name) msg += '\nNombre: ' + chatState.name;
  if (sym) msg += '\nProblema: ' + sym.title + ' — ' + sym.text;
  if (chatState.urgent) msg += '\nUrgencia: ' + chatState.urgent;
  return msg;
}

function chatHandoff() {
  chatState.step = 'done';
  chatSay(BOT.handoffTitle + '. ' + BOT.handoffText);
  chatLink(BOT.cta, waLink(chatSummary()), true);
  chatBubble('<span class="text-neutral-500">' + BOT.notSure + '</span>', 'bot');
}

function chatMatchFault(text) {
  const t = ' ' + deaccent(text) + ' ';
  const hits = Object.keys(KEYWORDS).filter(k => KEYWORDS[k].some(w => t.includes(' ' + deaccent(w))));
  if (!hits.length) return -1;
  const order = ['droplet', 'power', 'battery', 'monitor', 'keyboard', 'fan'];
  for (const k of order) if (hits.includes(k)) return CONFIG.symptoms.items.findIndex(s => s.icon === k);
  return -1;
}

function chatMatchFaq(text) {
  const t = deaccent(text);
  for (const f of FAQ_KEYS) if (f.keys.some(k => t.includes(k))) return f.id;
  return '';
}

function chatSubmit(text) {
  const t = (text || '').trim();
  if (!t) return;
  chatBubble(t.replace(/[<>]/g, ''), 'user');
  const faq = chatMatchFaq(t);
  if (chatState.step === 'name') { chatState.name = t.slice(0, 40); return chatHandoff(); }
  if (faq) { chatSay(chatFaq(faq)); return chatOfferContinue(); }
  const f = chatMatchFault(t);
  if (f >= 0) return chatPickSymptom(f);
  chatSay(BOT.fallback + '<br><span class="text-neutral-500">' + BOT.notSure + '</span>');
}

function chatOfferContinue() {
  chatChips(['Quiero cotizar', 'Hablar con el técnico'], i => {
    if (i === 0) { chatBubble(BOT.steps.device, 'user'); chatState.step = 'device'; chatChips(BOT.devices, k => chatPickDevice(BOT.devices[k])); }
    else chatLink(BOT.cta, waLink(), true);
  });
}

function chatOpen(open) {
  const panel = document.getElementById('chat-panel');
  if (!panel) return;
  panel.dataset.open = open ? '1' : '0';
  document.body.classList.toggle('chat-open', open);
  document.getElementById('chat-launcher').setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) {
    const badge = document.getElementById('chat-badge');
    if (badge) badge.remove();
    setTimeout(chatScroll, 60);
    document.getElementById('chat-input').focus();
  }
}

function initChat() {
  if (!BOT.enabled) return;
  const launcher = document.getElementById('chat-launcher');
  if (!launcher) return;
  launcher.addEventListener('click', () => {
    chatOpen(true);
    if (!chatLog().children.length) {
      chatTyping();
      setTimeout(chatStart, 500);
    }
  });
  document.querySelectorAll('[data-chat-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.chatAct === 'close') chatOpen(false);
      if (btn.dataset.chatAct === 'reset') { chatOpen(true); chatTyping(); setTimeout(chatStart, 400); }
    });
  });
  document.getElementById('chat-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    chatSubmit(input.value);
    input.value = '';
  });
}

  document.getElementById('app').innerHTML = header + hero + maint + symptoms + services + process + why + contact + footer + float + chatMarkup();

  const headerEl = document.getElementById('header');
  const floatEl = document.getElementById('wa-float');
  const onScroll = () => {
    const y = window.scrollY;
    headerEl.classList.toggle('bg-ink-950/85', y > 10);
    headerEl.classList.toggle('backdrop-blur-md', y > 10);
    headerEl.classList.toggle('border-white/[.07]', y > 10);
    const show = y > 500;
    floatEl.classList.toggle('translate-y-0', show);
    floatEl.classList.toggle('opacity-100', show);
    floatEl.classList.toggle('pointer-events-auto', show);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const revealEls = document.querySelectorAll('[data-reveal]');

  if (!('IntersectionObserver' in window)) {
    revealEls.forEach(el => el.classList.add('reveal-in'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('reveal-in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px' });
    revealEls.forEach((el, i) => {
      el.classList.add('reveal');
      el.style.transitionDelay = (i % 4) * 60 + 'ms';
      io.observe(el);
    });

    let queued = false;
    const revealVisible = () => {
      queued = false;
      const h = window.innerHeight;
      revealEls.forEach(el => {
        if (el.classList.contains('reveal-in')) return;
        if (el.getBoundingClientRect().top < h) { el.classList.add('reveal-in'); io.unobserve(el); }
      });
    };
    window.addEventListener('scroll', () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(revealVisible);
    }, { passive: true });
    revealVisible();
  }

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  initChat();
